name: Build & Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional tag to attach artifacts to (must already exist as a release). Leave blank for artifact-only run."
        required: false
        default: ""
      platforms:
        description: "Which platforms to build (comma-separated subset of: macos,windows,linux,android,web,ios). Default: all."
        required: false
        default: "all"

jobs:
  setup:
    name: Resolve build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - id: gen
        shell: bash
        env:
          PLATFORMS: ${{ github.event_name == 'workflow_dispatch' && inputs.platforms || 'all' }}
        run: |
          all='[
            {"name":"macos-universal","runner":"macos-14","platform":"macos","shader_platform":"macos","arch":"universal"},
            {"name":"windows-x86_64","runner":"windows-2022","platform":"windows","shader_platform":"windows","arch":"x86_64"},
            {"name":"linux-x86_64","runner":"ubuntu-22.04","platform":"linux","shader_platform":"linuxbsd","arch":"x86_64"},
            {"name":"android-arm64","runner":"ubuntu-22.04","platform":"android","shader_platform":"android","arch":"arm64"},
            {"name":"web-wasm32","runner":"ubuntu-22.04","platform":"web","shader_platform":"web","arch":"wasm32"},
            {"name":"ios-arm64","runner":"macos-14","platform":"ios","shader_platform":"ios","arch":"arm64"}
          ]'
          if [ "$PLATFORMS" = "all" ]; then
            filtered="$all"
          else
            filtered=$(echo "$all" | python3 -c "import json,sys,os; sel=set(s.strip() for s in os.environ['PLATFORMS'].split(',') if s.strip()); print(json.dumps([c for c in json.load(sys.stdin) if c['platform'] in sel]))")
          fi
          echo "matrix=$(echo "$filtered" | tr -d '\n' | tr -s ' ')" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.config.name }} (Godot ${{ matrix.godot }}, ${{ matrix.target }})
    needs: setup
    runs-on: ${{ matrix.config.runner }}
    strategy:
      fail-fast: false
      matrix:
        target: [template_debug, template_release]
        godot: ["4.5", "4.6"]
        config: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Pin godot-cpp version
        shell: bash
        run: |
          cd third-party/godot-cpp
          case "${{ matrix.godot }}" in
            4.5)
              GODOT_CPP_TAG="godot-4.5-stable"
              echo "Using godot-cpp tag: $GODOT_CPP_TAG"
              git fetch --depth=1 origin tag "$GODOT_CPP_TAG"
              git checkout "$GODOT_CPP_TAG"
              ;;
            4.6)
              # Use master (already checked out) for Godot 4.6.x compatibility
              echo "Using godot-cpp master for Godot 4.6"
              ;;
          esac

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SCons
        run: python -m pip install --upgrade pip scons ply

      # Linux deps: OpenGL / X11 headers + glslang/spirv-tools for Rive shader build.
      - name: Install Linux build deps
        if: matrix.config.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgl1-mesa-dev libx11-dev libxrandr-dev libxcursor-dev libxinerama-dev libxi-dev glslang-tools spirv-tools

      # Android: install NDK deps + set env vars for SCons
      - name: Setup Android NDK
        if: matrix.config.platform == 'android'
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools spirv-tools libegl1-mesa-dev libvulkan-dev
          # Apply patches to rive-runtime for Android compatibility
          git -C third-party/rive-runtime apply ../../third-party/patches/vulkan-arm-fix.patch || true
          cp third-party/patches/vk_mem_alloc.h third-party/rive-runtime/renderer/include/
          # godot-cpp expects NDK at $ANDROID_HOME/ndk/<ndk_version> where ndk_version defaults to 28.1.13356709.
          # GHA ubuntu-22.04 ships 27.3.13750724 as default — fix the path manually.
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      # Web (Emscripten): install emsdk for wasm32 build
      - name: Setup Emscripten
        if: matrix.config.platform == 'web'
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74

      # iOS: install Vulkan deps for shader build + link frameworks
      - name: Setup iOS build
        if: matrix.config.platform == 'ios'
        run: |
          brew install glslang spirv-tools || true

      # Windows: enable MSVC + ensure fxc.exe (Windows SDK) is on PATH for shader build.
      - name: Setup MSVC
        if: matrix.config.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Vulkan SDK on Windows/Linux (Rive needs Vulkan headers >= 1.4.318 for VK_ARM_format_pack).
      - name: Install Vulkan SDK
        if: matrix.config.platform == 'windows' || matrix.config.platform == 'linux'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.321.1
          install_runtime: false
          cache: true
          stripdown: false

      - name: Verify Vulkan SDK headers
        if: matrix.config.platform == 'windows' || matrix.config.platform == 'linux'
        shell: bash
        run: |
          echo "VULKAN_SDK=$VULKAN_SDK"
          ls "$VULKAN_SDK/Include/vulkan/vulkan.h" 2>/dev/null || ls "$VULKAN_SDK/include/vulkan/vulkan.h"

      # Vulkan Memory Allocator (header-only) — Rive's vulkan backend includes vk_mem_alloc.h.
      - name: Fetch VulkanMemoryAllocator
        if: matrix.config.platform == 'windows' || matrix.config.platform == 'linux'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/vma/include/vma"
          curl -fsSL -o "$RUNNER_TEMP/vma/include/vk_mem_alloc.h" \
            https://raw.githubusercontent.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator/v3.1.0/include/vk_mem_alloc.h
          cp "$RUNNER_TEMP/vma/include/vk_mem_alloc.h" "$RUNNER_TEMP/vma/include/vma/vk_mem_alloc.h"
          # Place the header inside the SDK's include directory so SConscript.rive picks it up.
          # Windows uses 'Include', Linux uses 'include'.
          for inc in "$VULKAN_SDK/Include" "$VULKAN_SDK/include"; do
            if [ -d "$inc" ]; then
              mkdir -p "$inc/vma"
              cp "$RUNNER_TEMP/vma/include/vk_mem_alloc.h" "$inc/vk_mem_alloc.h"
              cp "$RUNNER_TEMP/vma/include/vk_mem_alloc.h" "$inc/vma/vk_mem_alloc.h"
              ls "$inc/vk_mem_alloc.h"
            fi
          done

      # DirectX-Headers (provides d3dx12.h) for the Rive D3D12 renderer.
      - name: Fetch DirectX-Headers (Windows)
        if: matrix.config.platform == 'windows'
        shell: bash
        run: |
          git clone --depth 1 --branch v1.614.0 https://github.com/microsoft/DirectX-Headers.git "$RUNNER_TEMP/DirectX-Headers"
          echo "DIRECTX_HEADERS_PATH=$RUNNER_TEMP/DirectX-Headers" >> "$GITHUB_ENV"

      - name: Generate Rive shaders
        shell: bash
        run: |
          python3 scripts/build_shaders.py \
            third-party/rive-runtime/renderer/src/shaders \
            third-party/rive-runtime/renderer/include/generated/shaders \
            ${{ matrix.config.shader_platform }}

      - name: Build
        shell: bash
        run: |
          SCONS_ARGS="platform=${{ matrix.config.platform }} target=${{ matrix.target }} arch=${{ matrix.config.arch }}"
          if [ "${{ matrix.config.platform }}" = "android" ]; then
            # GHA ubuntu-22.04 image ships NDK r27c (27.3.13750724), but godot-cpp defaults to 28.1.
            # Also set Android API level to 24 (minimum supported by Godot 4.6).
            SCONS_ARGS="$SCONS_ARGS ndk_version=27.3.13750724 android_api_level=24"
          fi
          scons $SCONS_ARGS -j$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo 4)

      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p staged/addons/godot-rive/bin
          cp -R project/addons/godot-rive/godot-rive.gdextension staged/addons/godot-rive/ || true
          cp -R project/addons/godot-rive/godot-rive.gdextension.uid staged/addons/godot-rive/ 2>/dev/null || true
          # Copy whatever the build produced for this platform/target.
          cp -R project/addons/godot-rive/bin/* staged/addons/godot-rive/bin/ || true
          ls -R staged

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-rive-g${{ matrix.godot }}-${{ matrix.config.name }}-${{ matrix.target }}
          path: staged/**
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package & attach to release
    needs: build
    runs-on: ubuntu-22.04
    if: always() && needs.build.result == 'success'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Merge artifacts into per-version addon trees
        run: |
          set -e
          for godot_ver in 4.5 4.6; do
            mkdir -p "package-g${godot_ver}/addons/godot-rive/bin"
            for d in dist/godot-rive-g${godot_ver}-*/addons/godot-rive; do
              if [ -d "$d" ]; then
                cp -R "$d/." "package-g${godot_ver}/addons/godot-rive/"
              fi
            done
            (cd "package-g${godot_ver}" && zip -r "../godot-rive-godot${godot_ver}-${{ github.ref_name }}.zip" addons)
            ls -lh godot-rive-godot${godot_ver}-*.zip
          done

      - name: Upload merged zip artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godot-rive-addon-zips
          path: godot-rive-godot*.zip
          retention-days: 30

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: godot-rive-godot*.zip